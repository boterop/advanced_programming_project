spring.application.name=bnb
server.servlet.context-path=/api

spring.datasource.url=jdbc:h2:mem:uqbnb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=always

sga.alojamiento.umbralEdadFacturable=5
sga.alojamiento.horaEntrada=14:00
sga.alojamiento.horaSalida=10:00
sga.alojamiento.tiempoPreparacionHoras=2
sga.alojamiento.plazoConfirmacionHoras=24
sga.alojamiento.horaLimiteNoShow=12:00
sga.alojamiento.exigeAnticipo=true
sga.alojamiento.porcentajeAnticipo=0.20
sga.alojamiento.nochesDescuentoEstanciaProlongada=3
sga.alojamiento.porcentajeDescuentoEstanciaProlongada=0.10
sga.alojamiento.recargoLlegadaNocturna=50000
sga.alojamiento.horaInicioLlegadaNocturna=22:00
sga.alojamiento.horaFinLlegadaNocturna=06:00

# --- Seguridad y JWT ---
# La clave NO se escribe aqui. Se lee de application-secrets.properties (no versionado) o, si existe,
# de la variable de entorno SGA_JWT_SECRET, que tiene prioridad.
spring.config.import=optional:classpath:application-secrets.properties
sga.jwt.emisor=sga
sga.jwt.expiracion-minutos=30